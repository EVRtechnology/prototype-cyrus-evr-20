<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVR Frontend Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
        }
        h1 { color: #667eea; }
        h2 { color: #333; margin-top: 0; }
        .status {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            display: inline-block;
            font-weight: 600;
        }
        .status.success { background: #10b981; color: white; }
        .status.error { background: #ef4444; color: white; }
        .status.pending { background: #f59e0b; color: white; }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 0.5rem;
            margin-top: 0.5rem;
        }
        button:hover { opacity: 0.9; }
        pre {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
        }
        .result { margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>EVR Frontend Tester</h1>
    <p>Use this page to test your frontend setup before opening the main app.</p>

    <div class="test-card">
        <h2>1. Backend Connection Test</h2>
        <button onclick="testBackend()">Test Backend</button>
        <div id="backend-result" class="result"></div>
    </div>

    <div class="test-card">
        <h2>2. WebSocket Test</h2>
        <button onclick="testWebSocket()">Test WebSocket</button>
        <div id="ws-result" class="result"></div>
    </div>

    <div class="test-card">
        <h2>3. Create Test Session</h2>
        <button onclick="createTestSession()">Create Session</button>
        <button onclick="copyTestCode()">Copy Code</button>
        <div id="session-result" class="result"></div>
    </div>

    <div class="test-card">
        <h2>4. Frontend Files Check</h2>
        <button onclick="checkFiles()">Check Files</button>
        <div id="files-result" class="result"></div>
    </div>

    <div class="test-card">
        <h2>5. Open Main App</h2>
        <p>Once all tests pass, you can open the main application:</p>
        <button onclick="window.open('frontend/index.html', '_blank')">Open Frontend App</button>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const API_URL = 'http://localhost:3000';
        let testSessionCode = null;

        async function testBackend() {
            const result = document.getElementById('backend-result');
            result.innerHTML = '<span class="status pending">Testing...</span>';

            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();

                if (data.status === 'healthy') {
                    result.innerHTML = `
                        <span class="status success">✅ Backend Connected</span>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    result.innerHTML = '<span class="status error">❌ Backend Unhealthy</span>';
                }
            } catch (error) {
                result.innerHTML = `
                    <span class="status error">❌ Connection Failed</span>
                    <p>Make sure backend is running on port 3000:</p>
                    <pre>cd backend && npm run dev</pre>
                    <p>Error: ${error.message}</p>
                `;
            }
        }

        function testWebSocket() {
            const result = document.getElementById('ws-result');
            result.innerHTML = '<span class="status pending">Connecting...</span>';

            try {
                const socket = io(API_URL);

                socket.on('connect', () => {
                    result.innerHTML = `
                        <span class="status success">✅ WebSocket Connected</span>
                        <p>Socket ID: ${socket.id}</p>
                    `;
                    setTimeout(() => socket.disconnect(), 2000);
                });

                socket.on('connect_error', (error) => {
                    result.innerHTML = `
                        <span class="status error">❌ WebSocket Failed</span>
                        <p>Error: ${error.message}</p>
                    `;
                });
            } catch (error) {
                result.innerHTML = `
                    <span class="status error">❌ WebSocket Error</span>
                    <p>Error: ${error.message}</p>
                `;
            }
        }

        async function createTestSession() {
            const result = document.getElementById('session-result');
            result.innerHTML = '<span class="status pending">Creating session...</span>';

            try {
                const response = await fetch(`${API_URL}/api/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'Test Session',
                        facilitatorId: 'test-facilitator'
                    })
                });

                const session = await response.json();

                if (response.ok) {
                    testSessionCode = session.code;
                    result.innerHTML = `
                        <span class="status success">✅ Session Created</span>
                        <pre>${JSON.stringify(session, null, 2)}</pre>
                        <p><strong>Session Code: ${session.code}</strong></p>
                        <p>Use this code to join as a participant in the main app!</p>
                    `;
                } else {
                    result.innerHTML = `
                        <span class="status error">❌ Failed to Create Session</span>
                        <p>Error: ${session.error || 'Unknown error'}</p>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <span class="status error">❌ Request Failed</span>
                    <p>Error: ${error.message}</p>
                `;
            }
        }

        function copyTestCode() {
            if (!testSessionCode) {
                alert('Create a test session first!');
                return;
            }

            navigator.clipboard.writeText(testSessionCode).then(() => {
                alert(`Session code ${testSessionCode} copied to clipboard!`);
            });
        }

        async function checkFiles() {
            const result = document.getElementById('files-result');
            const files = [
                'frontend/index.html',
                'frontend/styles/main.css',
                'frontend/js/config.js',
                'frontend/js/api.js',
                'frontend/js/socket.js',
                'frontend/js/ui.js',
                'frontend/js/facilitator.js',
                'frontend/js/participant.js',
                'frontend/js/app.js'
            ];

            let html = '<h3>Checking files...</h3>';
            let allFound = true;

            for (const file of files) {
                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    if (response.ok) {
                        html += `<p>✅ ${file}</p>`;
                    } else {
                        html += `<p>❌ ${file} (Not found)</p>`;
                        allFound = false;
                    }
                } catch (error) {
                    html += `<p>❌ ${file} (Error: ${error.message})</p>`;
                    allFound = false;
                }
            }

            if (allFound) {
                html = '<span class="status success">✅ All Files Present</span>' + html;
            } else {
                html = '<span class="status error">❌ Some Files Missing</span>' + html;
            }

            result.innerHTML = html;
        }

        // Auto-run tests on load
        window.addEventListener('load', () => {
            setTimeout(testBackend, 500);
        });
    </script>
</body>
</html>
